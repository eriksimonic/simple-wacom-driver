name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

env:
  ZADIG_URL: https://github.com/pbatard/libwdi/releases/download/v1.5.1/zadig-2.9.exe
  ZADIG_SHA256: 4ecaa95df3da3621486a043aef8b3050b8bafe7c901402871e816229ef82039b

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: cargo build --release

      - name: Download Zadig
        shell: pwsh
        run: |
          Invoke-WebRequest $env:ZADIG_URL -OutFile installer/zadig/zadig.exe
          $hash = (Get-FileHash installer/zadig/zadig.exe -Algorithm SHA256).Hash
          if ($hash -ne $env:ZADIG_SHA256.ToUpper()) { throw "Zadig hash mismatch: $hash" }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $version = if ("${{ github.ref }}" -like 'refs/tags/v*') { "${{ github.ref_name }}".TrimStart('v') } else { '0.0.0' }
          & $iscc "/DAppVersion=$version" installer/setup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/wacom.exe, buttons.yaml, install.ps1, uninstall.ps1, check-winusb.ps1, README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath simple-wacom-driver.zip

      - uses: actions/upload-artifact@v4
        with:
          name: simple-wacom-driver
          path: |
            simple-wacom-driver.zip
            installer/Output/simple-wacom-driver-setup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" simple-wacom-driver.zip installer/Output/simple-wacom-driver-setup.exe --generate-notes
